<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
  </head>
<body>
<div class="container" >
    <div class="left">

        <h3>OnlyPipe</h3>
        <h1>Get Started with Us</h1>
        <p>Complete these easy steps to register<br> your account</p>
        <div class="btn">
            <button>Sign up your account</button>
            <button>Set up your workspace</button>
            <button>Set up your profile</button>
         </div>
    </div>
    <div class="right" >
        <h2>Sign up Account</h2>
        <p>Enter your persnal data to create your account</p>
        <div class="glbtn">
            <button>Google</button>
            <button>Github</button>
        </div>
        <div class="rightbottom">
           <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="eg. John">
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="eg. Doe">
                </div>
            </div>
            <div>

            </div>
            <div class="bottom">
                <label for="">Email</label>
                <input type="email" placeholder="eg.johndoe@gmail.com">
                <label for="">Password</label>
                <input type="password" placeholder="Enter your password">
                <p>Must be atleast 8 characters</p>
                <button>Sign up</button>
                <p class="login">
                    Already have an account?
                    <a href="#">Log in</a>
                 </p>
            </div>

        </div>
    </div>
</div>
</body>


</html>
